name: Close superseded Dependabot PRs

on:
  push:
    branches: [cursor/dependabot-groups-68af]

permissions:
  pull-requests: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - name: Close one breaking PR to prove the token can close
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: bytesofconnor/minny-agents
        run: |
          gh pr close 41 --repo "$GH_REPO" --comment "Closed because it breaks. npm ci failed: eslint-config-next@15.5.28 accepts eslint 7, 8, or 9, not eslint 10. Not migrating that pair in this change."
