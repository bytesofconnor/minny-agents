name: Production Smoke Tests

# GITHUB_TOKEN merges do not start push workflows. closed+merged covers
# merges GitHub still delivers. workflow_run covers a CI run whose PR is
# already merged. Vercel is a GitHub App, so it still receives the push
# webhook and deploys. This workflow does not deploy.

on:
  pull_request:
    types: [closed]
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  wait-for-vercel:
    name: Wait for Vercel Deployment
    runs-on: ubuntu-latest
    outputs:
      deployment-url: ${{ steps.wait.outputs.url }}
      run: ${{ steps.wait.outputs.run }}
    steps:
      - name: Run only after a merge to main
        id: wait
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if [ "${{ github.event.pull_request.merged }}" != "true" ]; then
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "Closed without merge"
              exit 0
            fi
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "url=https://minnyagents.com" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "CI did not succeed"
            exit 0
          fi

          NUM=$(jq -r '.workflow_run.pull_requests[0].number // empty' "$GITHUB_EVENT_PATH")
          if [ -z "$NUM" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "CI run has no pull request"
            exit 0
          fi
          MERGED=$(gh pr view "$NUM" --json state,baseRefName --jq 'select(.state=="MERGED" and .baseRefName=="main") | .state')
          if [ "$MERGED" = "MERGED" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "url=https://minnyagents.com" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "PR #$NUM is not merged to main"
          fi

  smoke-prod:
    name: Smoke Test Production
    needs: wait-for-vercel
    if: needs.wait-for-vercel.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      
      - run: npm ci
      
      - run: npx playwright install --with-deps chromium
      
      - name: Run smoke tests against production
        env:
          BASE_URL: ${{ needs.wait-for-vercel.outputs.deployment-url }}
        run: npx playwright test
      
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: prod-smoke-screenshots
          path: test-results/
          retention-days: 7
      
      - name: Create issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "🚨 Production smoke tests failed after merge to main" \
            --label "prod-broken" \
            --body "Production smoke tests failed for commit ${{ github.sha }}.
          
          **Commit**: ${{ github.sha }}
          **Author**: ${{ github.actor }}
          **Workflow run**: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          
          Please investigate and fix ASAP."
