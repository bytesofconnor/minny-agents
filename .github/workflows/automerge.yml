name: Auto-merge

# Enable GitHub auto-merge as soon as a PR is eligible, and squash-merge
# any green, non-draft, non-hold PR if native auto-merge does not fire.
# Requires repo setting allow_auto_merge=true for --auto; the safety-net
# job merges directly and does not depend on that setting.

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize, labeled, unlabeled]
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: automerge
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

jobs:
  enable-automerge:
    name: Enable auto-merge
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Enable squash auto-merge (skip draft / hold)
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          DRAFT=$(gh pr view "$PR" --json isDraft --jq '.isDraft')
          HOLD=$(gh pr view "$PR" --json labels --jq '[.labels[].name] | index("hold") != null')

          if [ "$DRAFT" = "true" ]; then
            echo "Skip: draft PR"
            exit 0
          fi

          if [ "$HOLD" = "true" ]; then
            echo "Hold label present — disabling auto-merge if set"
            gh pr merge "$PR" --disable-auto || true
            exit 0
          fi

          if gh pr merge "$PR" --squash --auto --delete-branch; then
            echo "Auto-merge enabled (squash) on #$PR"
          else
            echo "Could not enable native auto-merge on #$PR."
            echo "Repo allow_auto_merge may be false (needs admin). Safety-net job will squash-merge when checks are green."
          fi

  merge-ready:
    name: Squash-merge ready PRs
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Merge open non-draft, non-hold PRs that are CLEAN
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh pr list --state open --json number,isDraft,labels,mergeStateStatus,title \
            --jq '.[] | select(.isDraft == false) | select([.labels[].name] | index("hold") | not) | select(.mergeStateStatus == "CLEAN")' \
            > /tmp/ready.json

          if [ ! -s /tmp/ready.json ]; then
            echo "No CLEAN non-draft, non-hold PRs"
            exit 0
          fi

          jq -c '.' /tmp/ready.json | while read -r row; do
            NUM=$(echo "$row" | jq -r '.number')
            TITLE=$(echo "$row" | jq -r '.title')
            echo "Merging #$NUM — $TITLE (mergeStateStatus=CLEAN)"
            gh pr merge "$NUM" --squash --delete-branch --subject "$TITLE" \
              --body "Auto-merged after required checks passed"
          done
