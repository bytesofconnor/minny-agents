name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited, closed]
  push:
    branches: [cursor/dependabot-groups-68af]

jobs:
  lint-and-typecheck:
    name: Lint and Type Check
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: node scripts/required-checks.js --self-test
      - run: node scripts/automerge-policy.js --self-test

  build:
    name: Build
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build

  content-guard:
    name: Content Guard
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - run: node scripts/content-guard.js

  e2e-smoke:
    name: E2E Smoke Tests
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  checks:
    name: checks
    needs: [lint-and-typecheck, build, content-guard, e2e-smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prove PR body check rejects a missing section
        run: |
          set -euo pipefail
          if .github/scripts/pr-body-check.sh <<'BODY'
          ## Summary
          x
          ## Verification
          x
          BODY
          then
            echo "PR body check accepted a body without Blast Radius." >&2
            exit 1
          fi

      - name: Prove PR body check accepts the three sections
        run: |
          set -euo pipefail
          .github/scripts/pr-body-check.sh <<'BODY'
          ## Summary
          x
          ## Verification
          x
          ## Blast Radius
          x
          BODY

      - name: Check this PR body
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n' "$PR_BODY" | .github/scripts/pr-body-check.sh

      - name: Fail unless every needed job succeeded
        run: |
          fail=0
          require_success() {
            echo "$1 $2"
            if [ "$2" != "success" ]; then
              fail=1
            fi
          }
          require_success "Lint and Type Check" "${{ needs.lint-and-typecheck.result }}"
          require_success "Build" "${{ needs.build.result }}"
          require_success "Content Guard" "${{ needs.content-guard.result }}"
          require_success "E2E Smoke Tests" "${{ needs.e2e-smoke.result }}"
          exit "$fail"
