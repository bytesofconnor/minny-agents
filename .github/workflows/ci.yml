name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]

jobs:
  lint-and-typecheck:
    name: Lint and Type Check
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: node scripts/required-checks.js --self-test
      - run: node scripts/automerge-policy.js --self-test

  build:
    name: Build
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build

  content-guard:
    name: Content Guard
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/content-guard.js

  e2e-smoke:
    name: E2E Smoke Tests
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  checks:
    name: checks
    needs: [lint-and-typecheck, build, content-guard, e2e-smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every needed job succeeded
        run: |
          fail=0
          for result in \
            "${{ needs.lint-and-typecheck.result }}" \
            "${{ needs.build.result }}" \
            "${{ needs.content-guard.result }}" \
            "${{ needs.e2e-smoke.result }}"
          do
            echo "result $result"
            if [ "$result" != "success" ]; then
              fail=1
            fi
          done
          exit "$fail"
