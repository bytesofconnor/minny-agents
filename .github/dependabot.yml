version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One pull request for every npm update, including majors.
      # react and react-dom travel together because both match this group.
      npm:
        patterns:
          - "*"
    ignore:
      # CI runs Node 20 (actions/setup-node node-version). No .nvmrc or engines field.
      - dependency-name: "@types/node"
        versions:
          - ">=21"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
